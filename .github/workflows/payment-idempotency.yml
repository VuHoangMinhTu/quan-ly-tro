name: BeeHouse payment idempotency

on:
  pull_request:
    paths:
      - 'backend-api/**'
      - '.github/workflows/payment-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-payment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          MYSQL_DATABASE: beehouse_billing_v2_test
          MYSQL_USER: billing_test
          MYSQL_PASSWORD: ci-test-${{ github.run_id }}
        ports:
          - 13368:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend-api
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BILLING_V2_ENABLED: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13368'
      DB_DATABASE: beehouse_billing_v2_test
      DB_USERNAME: billing_test
      DB_PASSWORD: ci-test-${{ github.run_id }}
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
      LOG_LEVEL: critical
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, pdo_mysql, zip, gd, intl, bcmath
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan config:clear
      - name: Run payment, PayOS, ledger, migration and concurrency regressions
        run: |
          mkdir -p ../tmp/billing-v2-mysql
          php -d memory_limit=512M vendor/bin/phpunit \
            --bootstrap tests/Fixtures/BillingV2MysqlBootstrap.php \
            --fail-on-skipped --fail-on-incomplete \
            --log-junit ../tmp/billing-v2-mysql/payment-release-junit.xml \
            tests/Feature/ManualPaymentLedgerTest.php \
            tests/Feature/ManualPaymentIdempotencyTest.php \
            tests/Feature/PayOSApiTest.php \
            tests/Feature/LandlordPaymentSettingsTest.php \
            tests/Feature/BillingV2QaLifecycleTest.php \
            tests/Feature/PaymentApiTest.php \
            tests/Feature/InvoiceFinancialEditApiTest.php \
            tests/Feature/ManualPaymentLedgerMigrationTest.php \
            tests/Feature/PaymentMigrationSafetyTest.php \
            tests/Feature/ManualPaymentMysqlConcurrencyTest.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-regression-junit
          path: tmp/billing-v2-mysql/payment-release-junit.xml
          retention-days: 14
