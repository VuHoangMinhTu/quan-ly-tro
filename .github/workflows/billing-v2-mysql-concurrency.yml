
name: BeeHouse Integration QA

on:
  workflow_dispatch:
  push:
    branches: [codex/beehouse-integration-qa]

permissions:
  contents: read

jobs:
  mysql-concurrency:
    name: Integration QA (PHP 8.3 / MySQL 8.0 / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: beehouse_billing_v2_test
          MYSQL_USER: billing_test
          MYSQL_PASSWORD: ci_test_only
        ports:
          - 13369:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -pci_root_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    defaults:
      run:
        shell: bash
        working-directory: backend-api

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BILLING_V2_ENABLED: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13368'
      DB_DATABASE: beehouse_billing_v2_test
      DB_USERNAME: billing_test
      DB_PASSWORD: ci_test_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PAYOS_NEW_REQUESTS_ENABLED: 'false'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, pdo_mysql, pdo_sqlite, zip, gd, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan config:clear

      - name: Verify isolated database
        run: |
          php -r 'if (getenv("APP_ENV") !== "testing" || getenv("DB_HOST") !== "127.0.0.1" || getenv("DB_PORT") !== "13368" || getenv("DB_DATABASE") !== "beehouse_billing_v2_test") { fwrite(STDERR, "Unsafe database environment\n"); exit(1); }'

      - name: Laravel full suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          PAYOS_NEW_REQUESTS_ENABLED: 'true'
        run: |
          mkdir -p ../tmp/qa-reports
          php -d memory_limit=1024M vendor/bin/phpunit --log-junit ../tmp/qa-reports/laravel.xml 2>&1 | tee ../tmp/qa-reports/laravel.log

      - name: Verify PayOS disabled and checkout authorization
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          mkdir -p ../tmp/qa-reports
          php vendor/bin/phpunit --filter 'test_disabled_creation_preserves_legacy_requests_and_payments|test_legacy_status_transition_requires_checkout_for_a_v2_contract|test_case_i_rejects_cross_landlord_access_with_404' --log-junit ../tmp/qa-reports/safety.xml 2>&1 | tee ../tmp/qa-reports/safety.log

      - name: Run MySQL concurrency and idempotency
        if: ${{ !cancelled() }}
        run: |
          php -d memory_limit=512M vendor/bin/phpunit \
            --bootstrap tests/Fixtures/BillingV2MysqlBootstrap.php \
            --filter=BillingV2MysqlConcurrencyTest \
            --display-skipped \
            --fail-on-skipped --log-junit ../tmp/qa-reports/mysql.xml 2>&1 | tee ../tmp/qa-reports/mysql.log

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beehouse-backend-qa
          path: tmp/qa-reports/
          retention-days: 14

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend
        if: ${{ !cancelled() }}
        id: frontend
        timeout-minutes: 5
        working-directory: front-end
        run: npm ci --fetch-retries=1 --fetch-timeout=30000 2>&1 | tee ../tmp/qa-reports/npm-install.log

      - name: Frontend tests
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: front-end
        run: find src -name '*.test.mjs' -print0 | xargs -0 node --test 2>&1 | tee ../tmp/qa-reports/frontend.tap

      - name: Lint
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: front-end
        run: npm run lint 2>&1 | tee ../tmp/qa-reports/lint.log

      - name: Build
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        id: build
        working-directory: front-end
        run: npx vite build --outDir ../tmp/billing-v2-dist 2>&1 | tee ../tmp/qa-reports/build.log

      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: chromium
        timeout-minutes: 5
        working-directory: front-end
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: npx playwright install chromium 2>&1 | tee ../tmp/qa-reports/chromium-install.log

      - name: Chromium Utility Ledger desktop and mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        env:
          UTILITY_LEDGER_BROWSER: '1'
        run: E2E_PHP_PATH="$(command -v php)" node --test tests/e2e/billing-v2.browser.mjs 2>&1 | tee tmp/qa-reports/utility-chromium.tap

      - name: Chromium integrated ledger, deposit and checkout
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        env:
          CONTRACT_EXIT_BROWSER: '1'
          BEEHOUSE_INTEGRATION_BROWSER: '1'
        run: E2E_PHP_PATH="$(command -v php)" node --test tests/e2e/billing-v2.browser.mjs 2>&1 | tee tmp/qa-reports/integration-chromium.tap

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beehouse-integration-qa
          path: |
            tmp/qa-reports/
            tmp/contract-exit-*/
            tmp/utility-ledger-polish-*/
            backend-api/storage/logs/
          retention-days: 14
